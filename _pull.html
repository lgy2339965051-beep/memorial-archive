<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>读取数据</title>
<style>
  body { margin:0; padding:48px 28px; background:#0b100e; color:#f1ece1;
         font-family: -apple-system, "Microsoft YaHei", system-ui, sans-serif; line-height:1.9; }
  h1 { font-size:20px; font-weight:500; margin:0 0 14px; letter-spacing:.02em; }
  p  { color:#9d968a; font-size:13.5px; margin:0 0 8px; }
  .ok { color:#c8aa72; }
  .bad { color:#c96a5a; }
  code { background:#151a17; padding:2px 6px; border-radius:2px; font-size:12px; color:#c8aa72; }
</style>
</head>
<body>
<h1 id="t">正在读取本地数据…</h1>
<div id="p"></div>
<script>
(function () {
  var raw = null;
  try { raw = localStorage.getItem("memorial-archive-v1"); } catch (e) {}

  var t = document.getElementById("t");
  var p = document.getElementById("p");

  if (!raw) {
    t.className = "bad";
    t.textContent = "这个浏览器里没有找到你填的数据";
    p.innerHTML = "如果确定填过，说明你当时用的是另一个浏览器或另一个地址。<br>请用同一个浏览器打开这个页面：<code>" + location.href + "</code>";
    return;
  }

  var d = null;
  try { d = JSON.parse(raw); } catch (e) {}

  fetch("/__save", { method: "POST", body: raw })
    .then(function (r) { return r.text(); })
    .then(function (msg) {
      t.className = "ok";
      t.textContent = "已读取，可以关掉这个页面了";
      var names = (d && d.members || []).map(function (m) { return m.name; }).filter(Boolean);
      p.innerHTML =
        "站点名：<b>" + ((d && d.site && d.site.name) || "（未填）") + "</b><br>" +
        "人物：" + names.length + " 位" + (names.length ? "（" + names.join("、") + "）" : "") + "<br>" +
        "时间轴：" + ((d && d.events || []).length) + " 条<br>" +
        "上传体积：" + Math.round(raw.length / 1024) + " KB · " + msg;
    })
    .catch(function (e) {
      t.className = "bad";
      t.textContent = "提交失败：" + e;
    });
})();
</script>
</body>
</html>
