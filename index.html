<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b100e">
  <title>纪念档案</title>
  <meta name="description" content="一处安静的存放地，保存姓名、影像与共同的时间。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b100e'/%3E%3Crect x='10' y='10' width='44' height='44' fill='none' stroke='%23c8aa72' stroke-width='2'/%3E%3Ctext x='32' y='43' font-size='28' fill='%23c8aa72' text-anchor='middle' font-family='serif'%3E%E7%BA%AA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <a class="skip-link" href="#app">跳到主要内容</a>

  <header id="site-header" class="site-header"></header>

  <div id="app" class="app" role="main"></div>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- 搜索 -->
  <div id="search-overlay" class="overlay" hidden>
    <button class="overlay__backdrop" type="button" data-action="close-search" aria-label="关闭搜索"></button>
    <section class="search-panel" role="dialog" aria-modal="true" aria-labelledby="search-label">
      <header class="search-panel__head">
        <p class="eyebrow"><span class="eyebrow__line"></span>SEARCH · 检索档案</p>
        <button class="close-button" type="button" data-action="close-search" aria-label="关闭搜索">&times;</button>
      </header>
      <div class="search-panel__field">
        <span class="icon-search" aria-hidden="true"></span>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false"
          placeholder="姓名、地点、年份，或一句记得的话" aria-label="搜索档案内容">
        <span class="search-key">ESC</span>
      </div>
      <div id="search-results" class="search-results"></div>
    </section>
  </div>

  <!-- 影像 / 视频查看 -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__backdrop" type="button" data-action="close-lightbox" aria-label="关闭"></button>
    <div class="lightbox__stage" role="dialog" aria-modal="true" aria-label="影像查看">
      <header class="lightbox__bar">
        <span id="lightbox-counter" class="lightbox__counter"></span>
        <button class="close-button" type="button" data-action="close-lightbox" aria-label="关闭">&times;</button>
      </header>
      <div class="lightbox__viewport">
        <button class="lightbox__nav lightbox__nav--prev" type="button" data-action="lightbox-prev" aria-label="上一个">&larr;</button>
        <figure class="lightbox__figure" id="lightbox-figure"></figure>
        <button class="lightbox__nav lightbox__nav--next" type="button" data-action="lightbox-next" aria-label="下一个">&rarr;</button>
      </div>
      <span class="lightbox__watermark" aria-hidden="true" id="lightbox-watermark">纪念档案</span>
    </div>
  </div>

  <!-- 确认 -->
  <div id="confirm" class="confirm" hidden>
    <button class="confirm__backdrop" type="button" data-action="confirm-cancel" aria-label="取消"></button>
    <div class="confirm__panel" role="alertdialog" aria-modal="true">
      <p class="eyebrow">CONFIRM</p>
      <h2 id="confirm-title">请确认</h2>
      <p id="confirm-message"></p>
      <div class="confirm__actions">
        <button class="btn btn--ghost" type="button" data-action="confirm-cancel">取消</button>
        <button class="btn btn--solid" type="button" data-action="confirm-ok">确认</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <div class="noscript">这个页面需要启用 JavaScript 才能显示档案内容。</div>
  </noscript>

  <script src="assets/data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/views.js"></script>
  <script src="assets/editor.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
